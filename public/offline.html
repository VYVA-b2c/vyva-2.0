<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8253AB" />
    <title>VYVA is offline</title>
    <style>
      :root {
        color: #2f183f;
        background: #faf7f2;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e8ddd2;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(79, 43, 116, 0.12);
        padding: 28px;
      }

      .brand {
        color: #8253ab;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 25px;
        line-height: 1.16;
      }

      p {
        margin: 0;
        color: #62576a;
        font-size: 16px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        border-radius: 999px;
        background: #8253ab;
        color: #ffffff;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">VYVA</div>
      <h1>You are offline right now.</h1>
      <p>Reconnect to open your VYVA account, invitations, health details, and family updates securely.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
