      - name: Run Task 11 migration PostgreSQL test
        run: |
          node ./scripts/run-vitest.mjs \
            --testTimeout=180000 \
            migrations/0080_preventive_outbound_call_entry.test.ts

      - name: Run Task 11 store PostgreSQL test
        run: |
          node ./scripts/run-vitest.mjs \
            --testTimeout=180000 \
            server/engagement/preventiveOutboundCallStore.postgres.test.ts

      - name: Reset disposable schema before baseline bootstrap
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";

          const client = new pg.Client({
