    <style>
      #vyva-launch {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(165deg, #fffaf0 0%, #faf7f2 48%, #f6f0ff 100%);
        color: #2f183f;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 420ms ease, visibility 420ms ease;
      }

      #vyva-launch.vyva-launch--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .vyva-launch__stage {
        display: grid;
        justify-items: center;
        gap: 18px;
        width: min(84vw, 360px);
        text-align: center;
      }

      .vyva-launch__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 146px;
        aspect-ratio: 1;
      }

      .vyva-launch__mark::before,
      .vyva-launch__mark::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 1px solid rgba(130, 83, 171, 0.3);
        animation: vyva-launch-ring 1.75s ease-out infinite;
      }

      .vyva-launch__mark::after {
        animation-delay: 0.45s;
      }

      .vyva-launch__icon {
        position: relative;
        z-index: 1;
        width: 106px;
        height: 106px;
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(47, 24, 63, 0.24);
        animation: vyva-launch-float 1.65s ease-in-out infinite;
      }

      .vyva-launch__word {
        margin: 0;
        color: #8253ab;
        font-size: 3rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
      }

      .vyva-launch__line {
        margin: -6px 0 0;
        color: #6f6475;
        font-size: 0.95rem;
        font-weight: 800;
      }

      .vyva-launch__waves {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 7px;
        height: 42px;
      }

      .vyva-launch__waves span {
        display: block;
        width: 8px;
        min-height: 10px;
        border-radius: 999px;
        background: #ffdf61;
        animation: vyva-launch-wave 900ms ease-in-out infinite;
      }

      .vyva-launch__waves span:nth-child(2) { animation-delay: 90ms; }
      .vyva-launch__waves span:nth-child(3) { animation-delay: 180ms; }
      .vyva-launch__waves span:nth-child(4) { animation-delay: 270ms; }
      .vyva-launch__waves span:nth-child(5) { animation-delay: 360ms; }

      @keyframes vyva-launch-ring {
        0% {
          opacity: 0.72;
          transform: scale(0.58);
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }

      @keyframes vyva-launch-float {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-7px) scale(1.025);
        }
      }

      @keyframes vyva-launch-wave {
        0%, 100% {
          height: 12px;
          background: #ffdf61;
        }
        50% {
          height: 38px;
          background: #8253ab;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #vyva-launch,
        .vyva-launch__mark::before,
        .vyva-launch__mark::after,
        .vyva-launch__icon,
        .vyva-launch__waves span {
          animation: none;
          transition: none;
        }
      }

      @media (max-width: 420px) {
        .vyva-launch__word {
          font-size: 2.65rem;
        }
      }
    </style>
