    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      #vyva-launch {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #ffffff;
        color: #2f183f;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      #vyva-launch::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #ffffff 0%, #ffffff 58%, #f8f2ff 100%);
      }

      #vyva-launch.vyva-launch--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .vyva-launch__stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 18px;
        width: min(82vw, 340px);
        text-align: center;
        animation: vyva-launch-enter 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .vyva-launch__brand {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .vyva-launch__logo {
        display: block;
        width: min(84vw, 320px);
        height: auto;
        filter: drop-shadow(0 18px 30px rgba(47, 24, 63, 0.14));
      }

      .vyva-launch__fallback {
        color: #8253ab;
        font-family: "Lora", Georgia, serif;
        font-size: 3.25rem;
        font-weight: 600;
        line-height: 1;
      }

      .vyva-launch__trace {
        width: min(78vw, 316px);
        height: 46px;
        color: #8253ab;
        opacity: 0.96;
      }

      .vyva-launch__trace path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .vyva-launch__trace-base {
        stroke: rgba(130, 83, 171, 0.16);
        stroke-width: 2;
      }

      .vyva-launch__trace-live {
        stroke: url(#vyva-launch-gradient);
        stroke-width: 3;
        stroke-dasharray: 82 226;
        animation: vyva-launch-trace 1.18s cubic-bezier(0.42, 0, 0.2, 1) infinite;
      }

      @keyframes vyva-launch-enter {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes vyva-launch-trace {
        0% {
          stroke-dashoffset: 306;
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #vyva-launch,
        .vyva-launch__stage,
        .vyva-launch__trace-live {
          animation: none;
          transition: none;
        }
      }

      @media (max-width: 420px) {
        .vyva-launch__stage {
          gap: 20px;
        }

        .vyva-launch__fallback {
          font-size: 2.8rem;
        }

        .vyva-launch__trace {
          height: 42px;
        }
      }
    </style>
  </head>
  <body>
    <div id="vyva-launch" aria-label="Opening VYVA" role="status">
      <div class="vyva-launch__stage">
        <div class="vyva-launch__brand" aria-hidden="true">
          <img
            class="vyva-launch__logo"
            src="/assets/vyva/vyva-wordmark-launch.png"
            alt=""
            onerror="if (!this.dataset.fallback) { this.dataset.fallback = 'true'; this.src = 'assets/vyva/vyva-wordmark-launch.png'; } else { this.hidden = true; this.nextElementSibling.hidden = false; }"
            onload="this.nextElementSibling.hidden = true"
          />
          <span class="vyva-launch__fallback" hidden>VYVA</span>
        </div>
        <svg class="vyva-launch__trace" viewBox="0 0 286 46" aria-hidden="true">
          <defs>
            <linearGradient id="vyva-launch-gradient" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stop-color="#8253ab" stop-opacity="0" />
              <stop offset="44%" stop-color="#8253ab" />
              <stop offset="100%" stop-color="#f5b51b" />
            </linearGradient>
          </defs>
          <path class="vyva-launch__trace-base" d="M6 23 C31 23 31 10 56 10 S81 36 106 36 S131 16 156 16 S181 30 206 30 S231 14 280 14" />
          <path class="vyva-launch__trace-live" d="M6 23 C31 23 31 10 56 10 S81 36 106 36 S131 16 156 16 S181 30 206 30 S231 14 280 14" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
